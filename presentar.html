<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentar — Trabajo de grado</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #07172d;
        --surface: #0d2748;
        --paper: #f3f7fc;
        --blue: #0b5ea8;
        --yellow: #ffd21f;
        --line: #6d8fb2;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        color: var(--paper);
        font-family: "Bahnschrift", "Segoe UI", sans-serif;
        user-select: none;
      }

      body.oculto { cursor: none; }

      #escenario {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      #lienzo {
        width: 1920px;
        height: 1080px;
        border: 0;
        transform-origin: center center;
        background: var(--bg);
      }

      /* Barra de controles compacta, sintetizada y discreta */
      #barra {
        position: fixed;
        left: 50%;
        bottom: 18px;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 10px;
        width: min(920px, 92vw);
        height: 40px;
        padding: 4px 14px;
        transform: translateX(-50%);
        border: 1px solid rgba(109, 143, 178, 0.45);
        border-radius: 20px;
        background: rgba(7, 23, 45, 0.88);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(12px);
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      body.oculto #barra {
        opacity: 0;
        transform: translateX(-50%) translateY(14px);
        pointer-events: none;
      }

      button {
        height: 28px;
        min-width: 28px;
        padding: 0 8px;
        border: 1px solid rgba(109, 143, 178, 0.5);
        border-radius: 14px;
        background: rgba(13, 39, 72, 0.85);
        color: var(--paper);
        font-family: inherit;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
      }

      button:hover {
        border-color: var(--yellow);
        color: var(--yellow);
        background: rgba(11, 94, 168, 0.4);
      }

      #btnModo {
        min-width: auto;
        padding: 0 10px;
        font-size: 11px;
        letter-spacing: 0.03em;
        border-color: rgba(255, 210, 31, 0.6);
        color: var(--yellow);
        background: rgba(255, 210, 31, 0.12);
        height: 24px;
      }

      #btnModo.modo-auto {
        border-color: rgba(109, 143, 178, 0.45);
        color: var(--line);
        background: rgba(13, 39, 72, 0.8);
      }

      #pista {
        position: relative;
        flex: 1;
        height: 5px;
        background: rgba(13, 39, 72, 0.9);
        border: 1px solid rgba(109, 143, 178, 0.4);
        border-radius: 3px;
        cursor: pointer;
        overflow: hidden;
        transition: height 0.15s ease;
      }

      #pista:hover {
        height: 8px;
      }

      #avance {
        position: absolute;
        inset: 0;
        width: 0;
        background: var(--yellow);
        pointer-events: none;
        transition: width 0.08s linear;
      }

      .hito {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1.5px;
        background: rgba(243, 247, 252, 0.35);
        pointer-events: none;
      }

      #infoLamina {
        display: flex;
        align-items: baseline;
        gap: 6px;
        max-width: 220px;
        overflow: hidden;
        white-space: nowrap;
      }

      #contadorLamina {
        font-size: 12px;
        color: var(--yellow);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      #nombreLamina {
        font-size: 11px;
        color: var(--paper);
        text-overflow: ellipsis;
        overflow: hidden;
        opacity: 0.85;
      }

      #reloj {
        font-size: 11.5px;
        color: var(--line);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      #reloj b { color: var(--paper); font-weight: 700; }

      /* Selector desplegable compacto de capítulos */
      #selectCapitulo {
        height: 24px;
        max-width: 130px;
        padding: 0 6px;
        border: 1px solid rgba(109, 143, 178, 0.5);
        border-radius: 12px;
        background: #0d2748;
        color: var(--paper);
        font-family: inherit;
        font-size: 11px;
        outline: none;
        cursor: pointer;
      }

      #selectCapitulo:hover {
        border-color: var(--yellow);
        color: var(--yellow);
      }

      #ayuda {
        position: fixed;
        top: 14px;
        left: 50%;
        z-index: 100;
        padding: 5px 14px;
        transform: translateX(-50%);
        border: 1px solid rgba(109, 143, 178, 0.4);
        border-radius: 14px;
        background: rgba(7, 23, 45, 0.85);
        color: var(--line);
        font-size: 11.5px;
        letter-spacing: 0.02em;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        transition: opacity 0.25s ease;
        pointer-events: none;
      }

      body.oculto #ayuda { opacity: 0; }

      kbd {
        padding: 1px 5px;
        border: 1px solid rgba(109, 143, 178, 0.6);
        border-radius: 3px;
        background: rgba(13, 39, 72, 0.85);
        color: var(--yellow);
        font-family: inherit;
        font-size: 10.5px;
        font-weight: 700;
      }
    </style>
  </head>

      <select id="selectCapitulo" title="Saltar a capítulo"></select>

      const lienzo = document.getElementById("lienzo");
      const escenario = document.getElementById("escenario");
      const barra = document.getElementById("barra");
      const btnAnterior = document.getElementById("btnAnterior");
      const btnPlay = document.getElementById("btnPlay");
      const btnSiguiente = document.getElementById("btnSiguiente");
      const btnModo = document.getElementById("btnModo");
      const btnPantalla = document.getElementById("btnPantalla");
      const pista = document.getElementById("pista");
      const avance = document.getElementById("avance");
      const reloj = document.getElementById("reloj");
      const txtNumero = document.getElementById("txtNumero");
      const nombreLamina = document.getElementById("nombreLamina");
      const selectCapitulo = document.getElementById("selectCapitulo");

      let tl = null;
      let montado = false;
      let pasoActual = 0;
      let modoManual = true;
      let animacionEnCurso = null;

      function escalar() {
        const factor = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        lienzo.style.transform = "scale(" + factor + ")";
      }

      function formato(segundos) {
        const s = Math.max(0, Math.floor(segundos));
        return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
      }

      function sincronizarPasoConTiempo(t) {
        let indice = 0;
        for (let i = PASOS.length - 1; i >= 0; i--) {
          if (t >= PASOS[i].t - 0.2) {
            indice = i;
            break;
          }
        }
        return indice;
      }

      function refrescarUI() {
        if (!tl) return;
        const t = tl.time();
        const total = tl.duration() || 1405;
        avance.style.width = ((t / total) * 100) + "%";
        reloj.innerHTML = "<b>" + formato(t) + "</b> / " + formato(total);
        btnPlay.textContent = tl.isActive() ? "❚❚" : "▶";

        if (!modoManual) {
          pasoActual = sincronizarPasoConTiempo(t);
        }

        const paso = PASOS[pasoActual] || PASOS[0];
        txtNumero.textContent = String(pasoActual + 1);
        nombreLamina.textContent = paso.nombre;

        // Sincronizar selector de capítulos
        const capActivoIdx = CAPITULOS.findIndex((c, idx) => {
          const sig = CAPITULOS[idx + 1];
          return pasoActual >= c.pasoIndex && (!sig || pasoActual < sig.pasoIndex);
        });
        if (capActivoIdx >= 0 && selectCapitulo.selectedIndex !== capActivoIdx) {
          selectCapitulo.selectedIndex = capActivoIdx;
        }
      }

      function conectar() {
        if (montado) return;
        const ventana = lienzo.contentWindow;
        tl = ventana && ventana.__timelines && ventana.__timelines["trabajo-grado"];
        if (!tl) {
          setTimeout(conectar, 120);
          return;
        }
        montado = true;
        tl.pause(0);

        // Crear hitos en la pista y opciones de capítulos
        selectCapitulo.innerHTML = "";
        CAPITULOS.forEach((cap, idx) => {
          const hito = document.createElement("div");
          hito.className = "hito";
          hito.style.left = (cap.t / tl.duration()) * 100 + "%";
          pista.appendChild(hito);

          const opt = document.createElement("option");
          opt.value = cap.pasoIndex;
          opt.textContent = (idx + 1) + ". " + cap.nombre;
          selectCapitulo.appendChild(opt);
        });

        selectCapitulo.addEventListener("change", (e) => {
          const pasoIdx = Number(e.target.value);
          irAPaso(pasoIdx, true);
        });

        // Nota: NO adjuntar docLienzo.addEventListener aquí porque index.html
        // ya propaga los eventos directamente mediante manejarTecladoExterno,
        // manejarClicExterno y manejarContextExterno sin duplicados.

        irAPaso(0, false);
        requestAnimationFrame(bucle);
      }

      function bucle() {
        if (!modoManual && tl && tl.isActive()) {
          refrescarUI();
        }
        requestAnimationFrame(bucle);
      }

      function irAPaso(indice, conAnimacion = true) {
        if (!tl) return;
        const nuevoIndice = Math.max(0, Math.min(indice, PASOS.length - 1));
        const paso = PASOS[nuevoIndice];
        pasoActual = nuevoIndice;

        if (animacionEnCurso) {
          animacionEnCurso.kill();
          animacionEnCurso = null;
        }

        if (conAnimacion && modoManual) {
          const tiempoInicio = paso.t;
          const tiempoFin = paso.rest;
          tl.pause(tiempoInicio);

          const ventana = lienzo.contentWindow;
          const gsapInst = (ventana && ventana.gsap) || window.gsap;
          if (gsapInst && tiempoFin > tiempoInicio) {
            const animObj = { t: tiempoInicio };
            animacionEnCurso = gsapInst.to(animObj, {
              t: tiempoFin,
              duration: 0.5,
              ease: "power2.out",
              onUpdate: () => {
                tl.time(animObj.t);
                refrescarUI();
              },
              onComplete: () => {
                tl.pause(tiempoFin);
                animacionEnCurso = null;
                refrescarUI();
              }
            });
          } else {
            tl.pause(tiempoFin);
            refrescarUI();
          }
        } else {
          tl.pause(paso.rest);
          refrescarUI();
        }
      }

      let ultimaAccionNavegacion = 0;
      const COOLDOWN_NAVEGACION_MS = 250;

      function avanzarPaso() {
        if (!tl) return;
        const ahora = Date.now();
        if (ahora - ultimaAccionNavegacion < COOLDOWN_NAVEGACION_MS) return;
        ultimaAccionNavegacion = ahora;

        if (pasoActual < PASOS.length - 1) {
          irAPaso(pasoActual + 1, true);
        }
      }

      function retrocederPaso() {
        if (!tl) return;
        const ahora = Date.now();
        if (ahora - ultimaAccionNavegacion < COOLDOWN_NAVEGACION_MS) return;
        ultimaAccionNavegacion = ahora;

        if (pasoActual > 0) {
          irAPaso(pasoActual - 1, false);
        }
      }

      function alternarModo() {
        modoManual = !modoManual;
        if (modoManual) {
          btnModo.textContent = "● Manual";
          btnModo.classList.remove("modo-auto");
          if (animacionEnCurso) {
            animacionEnCurso.kill();
            animacionEnCurso = null;
          }
          if (tl) tl.pause(PASOS[pasoActual].rest);
        } else {
          btnModo.textContent = "● Auto";
          btnModo.classList.add("modo-auto");
          if (animacionEnCurso) {
            animacionEnCurso.kill();
            animacionEnCurso = null;
          }
          if (tl) tl.play();
        }
        refrescarUI();
      }

      function alternarPlay() {
        if (!tl) return;
        if (modoManual) {
          alternarModo();
        } else {
          if (tl.isActive()) tl.pause();
          else if (tl.time() >= tl.duration() - 0.1) tl.play(0);
          else tl.play();
          refrescarUI();
        }
      }

      function irATiempo(t) {
        if (!tl) return;
        const destino = Math.min(Math.max(t, 0), tl.duration());
        if (modoManual) {
          const idx = sincronizarPasoConTiempo(destino);
          irAPaso(idx, false);
        } else {
          if (tl.isActive()) tl.play(destino);
          else tl.pause(destino);
          refrescarUI();
        }
      }

      function desplazar(delta) {
        if (tl) irATiempo(tl.time() + delta);
      }

      window.manejarTecladoExterno = (e) => manejarTeclado(e);
      window.manejarClicExterno = (e) => manejarClic(e);
      window.manejarContextExterno = (e) => manejarContext(e);

      function manejarTeclado(evento) {
        despertar();
        if (evento.repeat) {
          evento.preventDefault();
          return;
        }

        if (evento.target && (evento.target.id === "selectCapitulo" || evento.target.tagName === "SELECT" || evento.target.tagName === "INPUT")) {
          return;
        }

        const code = evento.code;
        const key = evento.key;

        // Avanzar: Enter, Espacio (en manual), Flecha Derecha, Flecha Abajo, AvPág
        if (code === "Enter" || code === "NumpadEnter" || code === "PageDown" || code === "ArrowDown") {
          evento.preventDefault();
          avanzarPaso();
          return;
        }

        if (code === "Space") {
          evento.preventDefault();
          if (modoManual) avanzarPaso();
          else alternarPlay();
          return;
        }

        if (code === "ArrowRight") {
          evento.preventDefault();
          if (evento.shiftKey) desplazar(5);
          else avanzarPaso();
          return;
        }

        // Retroceder: Flecha Izquierda, Flecha Arriba, RePág, Backspace
        if (code === "ArrowLeft" || code === "ArrowUp" || code === "Backspace" || code === "PageUp") {
          evento.preventDefault();
          if (evento.shiftKey) desplazar(-5);
          else retrocederPaso();
          return;
        }

        if (code === "KeyM") {
          evento.preventDefault();
          alternarModo();
          return;
        }

        if (code === "Home") {
          evento.preventDefault();
          irAPaso(0, false);
          return;
        }

        if (code === "End") {
          evento.preventDefault();
          irAPaso(PASOS.length - 1, false);
          return;
        }

        if (key && key.toLowerCase() === "f") {
          btnPantalla.click();
          return;
        }

        const digito = Number(key);
        if (digito >= 1 && digito <= 9 && digito <= CAPITULOS.length) {
          irAPaso(CAPITULOS[digito - 1].pasoIndex, true);
        }
      }

      function manejarClic(evento) {
        if (evento.target && (evento.target.closest("#barra") || evento.target.closest("#ayuda"))) return;
        if (evento.button === 0) {
          avanzarPaso();
        }
      }

      function manejarContext(evento) {
        if (evento.target && (evento.target.closest("#barra") || evento.target.closest("#ayuda"))) return;
        if (evento.preventDefault) evento.preventDefault();
        retrocederPaso();
      }

      lienzo.addEventListener("load", conectar);
      if (lienzo.contentWindow && lienzo.contentWindow.document.readyState === "complete") conectar();

      btnAnterior.addEventListener("click", (e) => { e.stopPropagation(); retrocederPaso(); });
      btnSiguiente.addEventListener("click", (e) => { e.stopPropagation(); avanzarPaso(); });
      btnPlay.addEventListener("click", (e) => { e.stopPropagation(); alternarPlay(); });
      btnModo.addEventListener("click", (e) => { e.stopPropagation(); alternarModo(); });
      btnPantalla.addEventListener("click", (e) => {
        e.stopPropagation();
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      });

      escenario.addEventListener("click", manejarClic);
      escenario.addEventListener("contextmenu", manejarContext);

      pista.addEventListener("click", (evento) => {
        evento.stopPropagation();
        if (!tl) return;
        const caja = pista.getBoundingClientRect();
        const prop = (evento.clientX - caja.left) / caja.width;
        irATiempo(prop * tl.duration());
      });

      window.addEventListener("keydown", manejarTeclado);

      let temporizador;
      function despertar() {
        document.body.classList.remove("oculto");
        clearTimeout(temporizador);
        temporizador = setTimeout(() => document.body.classList.add("oculto"), 1800);
      }
      window.addEventListener("mousemove", despertar);
      window.addEventListener("keydown", despertar);
      despertar();

      window.addEventListener("resize", escalar);
      escalar();
    </script>
